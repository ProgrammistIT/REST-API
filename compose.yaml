services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: threat_password
      POSTGRES_DB: threat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_user -d threat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://threat_user:threat_password@db:5432/threat_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
